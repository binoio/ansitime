name: ANSITime
options:
  bundleIdPrefix: io.bino
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

targets:
  AnsiCore:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/AnsiCore
    settings:
      PRODUCT_NAME: AnsiCore
      SWIFT_VERSION: "5.9"
      SKIP_INSTALL: "YES"

  ANSITimeQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/ANSITimeQuickLook
    dependencies:
      - target: AnsiCore
    settings:
      PRODUCT_NAME: ANSITimeQuickLook
      PRODUCT_BUNDLE_IDENTIFIER: io.bino.ansitime.quicklook
      INFOPLIST_FILE: Sources/ANSITimeQuickLook/Info.plist
      GENERATE_INFOPLIST_FILE: "NO"
      CODE_SIGN_ENTITLEMENTS: Sources/ANSITimeQuickLook/ANSITimeQuickLook.entitlements
      SWIFT_VERSION: "5.9"
      ENABLE_HARDENED_RUNTIME: "YES"
      CODE_SIGN_STYLE: Automatic
      SKIP_INSTALL: "YES"

  ANSITime:
    type: application
    platform: macOS
    sources:
      - path: Sources/ANSITime
    dependencies:
      - target: AnsiCore
      - target: ANSITimeQuickLook
      - package: Sparkle
    settings:
      PRODUCT_NAME: ANSITime
      PRODUCT_BUNDLE_IDENTIFIER: io.bino.ansitime
      INFOPLIST_FILE: Sources/ANSITime/Info.plist
      GENERATE_INFOPLIST_FILE: "NO"
      CODE_SIGN_ENTITLEMENTS: Sources/ANSITime/ANSITime.entitlements
      SWIFT_VERSION: "5.9"
      ENABLE_HARDENED_RUNTIME: "YES"
      CODE_SIGN_STYLE: Automatic
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  AnsiCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AnsiCoreTests
    dependencies:
      - target: AnsiCore
    settings:
      SWIFT_VERSION: "5.9"
